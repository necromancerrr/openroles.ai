<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="openroles">
  <!-- The card, reduced to its anatomy: paper, a rule, and the decay rail at the
       leading edge in --age-0. The rail is the whole identity of the system. -->
  <rect width="32" height="32" rx="4" fill="#F4F5F3"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" fill="none" stroke="#DDE1DE"/>
  <rect x="4" y="6" width="4" height="20" rx="1" fill="#0E6B57"/>
  <rect x="12" y="8" width="16" height="3" rx="1.5" fill="#46504C"/>
  <rect x="12" y="14.5" width="12" height="3" rx="1.5" fill="#79837E"/>
  <rect x="12" y="21" width="8" height="3" rx="1.5" fill="#C3C9C5"/>
</svg>
